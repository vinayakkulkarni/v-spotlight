packages:
  - 'example'

allowBuilds:
  '@parcel/watcher': true
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - vite-plus
  - '@voidzero-dev/*'
  - tsdown
  - '@tsdown/*'
  - wrangler
  - miniflare
  - workerd
  - '@cloudflare/*'
  - vue
  - '@vue/*'
  - '@types/*'
  - '@commitlint/*'
